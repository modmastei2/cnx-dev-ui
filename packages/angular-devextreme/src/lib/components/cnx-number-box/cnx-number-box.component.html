<dx-number-box
  class="input-number"
  [id]="id"
  [name]="name"
  [format]="format"
  [max]="max"
  [min]="min"
  [tabIndex]="tabIndex"
  [disabled]="disabled"
  [value]="value"
  (onValueChanged)="onValueChanged($event)"
  (onFocusIn)="onFocusIn()"
  (onBlur)="onBlur()"
  (onPaste)="onPaste($event)"
  (onEnterKey)="onEnterKey()"
>
</dx-number-box>
