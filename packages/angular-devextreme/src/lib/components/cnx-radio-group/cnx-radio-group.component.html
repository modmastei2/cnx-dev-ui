<dx-radio-group
    [id]="'radio_group_' + id"
    [name]="'radio_group_' + name"
    [dataSource]="dataSource"
    [layout]="layout"
    [value]="value"
    [displayExpr]="displayExprOption"
    [valueExpr]="valueExprOption"
    [disabled]="disabled"
    (onValueChanged)="onValueChanged($event)"
></dx-radio-group>
